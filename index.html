<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A minimal markdown editor powered by Milkdown."
    />
    <title>Milkdown — A quiet place to write</title>
  </head>
  <body>
    <div class="site-shell">
      <main class="page-content">
        <div class="workspace-layout">
          <aside class="outline-sidebar" aria-label="Document outline">
            <section class="sidebar-section outline-section">
              <div class="sidebar-heading">
                <h2>Outline</h2>
              </div>
              <nav id="document-outline" aria-label="Document outline"></nav>
            </section>

          </aside>

          <div class="workspace-main">
            <section class="editor-card" aria-label="Markdown editor">
          <div class="editor-toolbar-stack">
          <div class="editor-toolbar">
            <button
              class="document-name"
              id="rename-document"
              type="button"
              title="Rename document"
              data-tooltip="Rename document"
            >
              <span class="file-icon" data-icon="file-text" aria-hidden="true"></span>
              <span id="document-name">untitled.md</span>
              <span class="document-name-edit" data-icon="edit" aria-hidden="true"></span>
            </button>
            <div class="layout-controls" aria-label="Document view controls">
              <label class="layout-control">
                <span>View</span>
                <select id="layout-mode" aria-label="Document view">
                  <option value="continuous">Continuous</option>
                  <option value="document">Document pages</option>
                  <option value="presentation">Presentation slides</option>
                </select>
              </label>
              <label class="layout-control" id="page-format-control">
                <span>Page</span>
                <select id="page-format" aria-label="Page format"></select>
              </label>
              <button
                class="copy-button page-settings-button"
                id="page-settings"
                type="button"
                title="Adjust page settings"
                data-tooltip="Adjust page settings"
                data-icon="sliders"
                aria-label="Adjust page settings"
              ></button>
              <span class="page-count" id="page-count" aria-live="polite"></span>
              <button
                class="copy-button present-button"
                id="present-document"
                type="button"
                title="Present document"
                data-tooltip="Present document"
                data-icon="fullscreen"
                aria-label="Present document"
              ></button>
            </div>
            <div class="toolbar-actions">
              <span
                class="save-status"
                id="save-status"
                title="Ready to write"
                aria-label="Ready to write"
              >
                <span class="status-dot" aria-hidden="true"></span>
                <span id="save-status-label" aria-hidden="true"></span>
              </span>
              <button
                class="copy-button project-action"
                data-project-action="store"
                type="button"
                title="Write the current file to disk"
                data-tooltip="Write the current file to disk"
                data-icon="save"
                aria-label="Write the current file to disk"
              ></button>
              <button
                class="copy-button project-action"
                data-project-action="reload"
                type="button"
                title="Reload the open folder from disk"
                data-tooltip="Reload the open folder from disk"
                data-icon="refresh"
                aria-label="Reload the open folder from disk"
              ></button>
              <button
                class="copy-button"
                data-file-export
                type="button"
                title="Export file"
                data-tooltip="Export file"
                data-icon="download"
                aria-label="Export file"
              ></button>
              <button
                class="copy-button"
                id="copy-markdown"
                type="button"
                title="Copy Markdown"
                data-tooltip="Copy Markdown"
                data-icon="copy"
                aria-label="Copy Markdown"
              ></button>
            </div>
          </div>

          <div class="rich-toolbar-host" id="rich-toolbar" aria-label="Rich text formatting"></div>
          </div>

          <div class="editor-wrap">
            <div id="editor"></div>
          </div>

          <div class="editor-footer">
            <span id="document-stats">0 words · 0 characters</span>
          </div>
            </section>

            <section
              class="csv-editor-card"
              id="csv-editor-card"
              hidden
              aria-label="CSV spreadsheet editor"
            >
              <div class="editor-toolbar csv-editor-toolbar">
                <button
                  class="document-name"
                  id="rename-csv-document"
                  type="button"
                  title="Rename spreadsheet"
                  data-tooltip="Rename spreadsheet"
                >
                  <span class="file-icon" data-icon="sheet" aria-hidden="true"></span>
                  <span id="csv-editor-name">CSV spreadsheet</span>
                  <span class="document-name-edit" data-icon="edit" aria-hidden="true"></span>
                </button>
                <div class="csv-editor-actions">
                  <span
                    id="csv-editor-status"
                    class="save-status"
                    title="Ready"
                    aria-label="Ready"
                  ><span class="status-dot" aria-hidden="true"></span></span>
                  <button
                    class="copy-button project-action"
                    data-project-action="store"
                    type="button"
                    title="Write the current file to disk"
                    data-tooltip="Write the current file to disk"
                    data-icon="save"
                    aria-label="Write the current file to disk"
                  ></button>
                  <button
                    class="copy-button project-action"
                    data-project-action="reload"
                    type="button"
                    title="Reload the open folder from disk"
                    data-tooltip="Reload the open folder from disk"
                    data-icon="refresh"
                    aria-label="Reload the open folder from disk"
                  ></button>
                  <button
                    class="copy-button"
                    data-file-export
                    type="button"
                    title="Export evaluated CSV"
                    data-tooltip="Export evaluated CSV"
                    data-icon="download"
                    aria-label="Export evaluated CSV"
                  ></button>
                  <button
                    class="copy-button"
                    id="csv-insert-table"
                    type="button"
                    title="Insert the current CSV as a Markdown table"
                    data-tooltip="Insert the current CSV as a Markdown table"
                    data-icon="table"
                    aria-label="Insert the current CSV as a Markdown table"
                  ></button>
                  <button
                    class="copy-button"
                    id="csv-insert-diagram"
                    type="button"
                    title="Insert Mermaid diagram"
                    data-tooltip="Insert Mermaid diagram"
                    data-icon="diagram"
                    aria-label="Insert Mermaid diagram"
                  ></button>
                  <button
                    class="copy-button"
                    id="csv-close"
                    type="button"
                    title="Return to the Markdown editor"
                    data-tooltip="Return to the Markdown editor"
                    data-icon="arrow-left"
                    aria-label="Return to the Markdown editor"
                  ></button>
                </div>
              </div>
              <div id="csv-spreadsheet" class="csv-spreadsheet"></div>
            </section>

            <details
              class="debug-markdown"
              id="debug-markdown-view"
              open
              hidden
              aria-label="Editable Markdown source"
            >
              <summary class="debug-markdown-header">
                <span>Markdown source</span>
                <span>Debug mode</span>
              </summary>
              <div class="debug-markdown-body">
                <textarea
                  id="debug-markdown-content"
                  aria-label="Markdown source"
                  placeholder="Empty Markdown document"
                  spellcheck="false"
                  wrap="off"
                ></textarea>
              </div>
            </details>
          </div>

          <div
            class="workspace-resizer workspace-resizer-right"
            id="editor-width-resizer"
            role="separator"
            aria-label="Resize editor"
            aria-orientation="vertical"
            aria-valuemin="520"
            aria-valuenow="0"
            tabindex="0"
          ></div>

          <aside class="workspace-sidebar" aria-label="Workspace files">
            <section class="sidebar-section files-section">
              <div class="sidebar-heading">
                <h2>Files</h2>
                <button class="sidebar-action" id="new-file" type="button" data-icon="plus" aria-label="Create file"></button>
              </div>
              <div class="folder-actions">
                <button class="folder-button" id="open-folder" type="button">Open folder</button>
              </div>
              <p class="folder-status" id="folder-status">Browser-local files</p>
              <ul class="file-list" id="file-list"></ul>
            </section>

          </aside>
        </div>

      </main>

    </div>

    <div class="source-dialog" id="source-dialog" hidden>
      <div class="source-dialog-card" role="dialog" aria-modal="true" aria-labelledby="source-dialog-title">
        <h2 id="source-dialog-title">Enter text</h2>
        <label id="source-dialog-label" for="source-dialog-input">Value</label>
        <textarea id="source-dialog-input" spellcheck="false"></textarea>
        <div class="source-dialog-actions">
          <button class="dialog-danger" id="source-dialog-remove" type="button" hidden>Remove</button>
          <button class="dialog-secondary" id="source-dialog-cancel" type="button">Cancel</button>
          <button class="dialog-primary" id="source-dialog-submit" type="button">Apply</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
